name: Build TalkTale Presentation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ppt:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate PowerPoint presentation
      run: |
        python create_talktale_ppt.py
    
    - name: Upload presentation artifact
      uses: actions/upload-artifact@v3
      with:
        name: talktale-presentation
        path: TalkTale_투자제안서.pptx
        retention-days: 30
    
    - name: Display success message
      run: |
        echo "✅ PowerPoint 파일이 성공적으로 생성되었습니다!"
        echo "📥 Artifacts 섹션에서 다운로드할 수 있습니다."
